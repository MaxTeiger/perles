<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d9dbe8">
<title>Perles : pixel art à trier</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #d9dbe8; color: #2b2d42;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  main { width: 100%; min-width: 0; max-width: 480px; padding: 12px 10px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; gap: 8px; }
  header h1 { flex: 1; margin: 0; text-align: center; color: #6a4fc2; font-size: 26px; font-weight: 800; letter-spacing: .3px; }
  .btn {
    border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer;
    background: #bfc2d6; color: #2b2d42;
  }
  .btn.main { background: #6cc24a; color: #fff; box-shadow: 0 3px 0 #4b9a2e; }
  .btn:active { transform: translateY(1px); }
  .progress { position: relative; height: 22px; background: #f4f4f8; border-radius: 999px; overflow: hidden; }
  .progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: #6cc24a; border-radius: 999px; transition: width .3s; }
  .progress span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  #board { width: 100%; display: block; border-radius: 6px; box-shadow: 0 4px 14px rgba(40,40,80,.18); }
  .hint { text-align: center; font-size: 13px; color: #5d6080; margin: 0; }
  #lots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px; align-items: center; }
  .lot {
    background: #fff; border-radius: 14px; padding: 10px 8px; display: flex; justify-content: center; gap: 6px;
    box-shadow: 0 3px 0 #b9bbd0; cursor: pointer; min-height: 52px; transition: opacity .2s, transform .1s;
  }
  .lot:active { transform: scale(.96); }
  .lot.off { opacity: .35; }
  .lot.empty { visibility: hidden; }
  .lot { align-items: center; }
  .lot .bead { flex: none; width: 28%; max-width: 30px; aspect-ratio: 1; }
  .lot.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #left { font-size: 12px; font-weight: 700; color: #5d6080; text-align: center; min-width: 38px; }
  #trays { display: grid; gap: 8px; }
  .tray {
    background: #fff; border-radius: 10px; padding: 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    box-shadow: 0 2px 0 #b9bbd0, inset 0 0 0 2px #eceaf2;
  }
  .tray.extra { box-shadow: 0 2px 0 #b9bbd0, inset 0 0 0 2px #6cc24a; }
  .slot { aspect-ratio: 1; border-radius: 32%; background: #ece3c9; box-shadow: inset 0 2px 3px rgba(0,0,0,.18); }
  .bead {
    border-radius: 32%;
    background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.6) 0 16%, transparent 19%), var(--c);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.25), 0 1px 1px rgba(0,0,0,.15);
  }
  .slot.bead { box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .slot.hidden { background: #ece3c9; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  dialog {
    border: 0; border-radius: 18px; padding: 20px; width: min(92vw, 420px); background: #fff; color: #2b2d42;
    box-shadow: 0 10px 40px rgba(0,0,0,.3); text-align: center;
  }
  dialog::backdrop { background: rgba(30,30,60,.45); }
  dialog h2 { margin: 0 0 6px; color: #6a4fc2; }
  dialog p { margin: 0 0 14px; color: #5d6080; }
  #levelList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .lvl { border: 0; background: #f1f0f7; border-radius: 12px; padding: 8px 4px; cursor: pointer; font: inherit; font-weight: 700; font-size: 13px; color: #2b2d42; }
  .lvl canvas { width: 100%; image-rendering: pixelated; border-radius: 6px; display: block; margin-bottom: 4px; }
  .lvl.done::after { content: " ✓"; color: #4b9a2e; }
  label.btn input { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <button class="btn" id="menuBtn" aria-label="Niveaux">☰</button>
    <h1 id="title">Perles</h1>
    <button class="btn" id="restartBtn" aria-label="Recommencer">↻</button>
  </header>
  <div class="progress"><i id="bar"></i><span id="pct">0%</span></div>
  <canvas id="board"></canvas>
  <p class="hint">Touche un lot : ses perles rejoignent les plateaux. 9 perles d'une même couleur et elles se posent sur l'image.</p>
  <div id="lots"></div>
  <div id="trays"></div>
</main>

<dialog id="menu">
  <h2>Niveaux</h2>
  <div id="levelList"></div>
  <div class="row">
    <label class="btn main">📷 Ta photo<input type="file" id="photo" accept="image/*"></label>
    <button class="btn" id="closeMenu">Fermer</button>
  </div>
</dialog>

<dialog id="msg">
  <h2 id="msgTitle"></h2>
  <p id="msgText"></p>
  <div class="row" id="msgBtns"></div>
</dialog>

<script src="game.js"></script>
</body>
</html>
